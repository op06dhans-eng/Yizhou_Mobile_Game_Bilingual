function reading() {

}

function play() {
  const s=scenario();
  return `<main class="screen play">${topbar(`${nums[state.round]}／四`)}<div class="intel"><span class="speaker">${bi(s.speaker)}</span><p>${bi(s.intel)}</p></div><section class="map-wrap" aria-label="局勢地圖 / Regional map"><div class="stage-track"><b>抉擇</b>${[1,2,3,4].map(i=>`<span class="${i<=state.round?'done':''}"></span>`).join('')}</div>${mapSvg()}<div class="map-meta"><span>${bi('211年・勢力示意')}</span>${act('map-info','讀圖','map-help')}</div></section><section class="decision"><div class="decision-header"><h2>${bi(`第${nums[state.round]}回合・${s.title}`,`Round ${state.round} · ${EN[s.title]}`)}</h2></div><p class="decision-description">${bi(s.desc)}</p><div class="choice-list" role="group" aria-label="本回合決策 / Choices this round">${s.options.map((o,i)=>`<button class="choice ${state.selected===o.id?'selected':''}" data-choice="${o.id}" aria-pressed="${state.selected===o.id}"><span class="choice-letter">${i?'B':'A'}</span><span class="choice-label">${bi(o.title)}</span>${state.selected===o.id?'<span class="checkmark" aria-hidden="true">✓</span>':''}</button>`).join('')}</div><div class="decision-utility"><span class="hint">${bi(state.selected?'已選擇，請確認回覆':'選擇後，確認回覆')}</span>${act(state.round===1?'supplies':'evidence',state.round===1?(state.asked?'重看軍糧答覆':'先問軍糧'):'軍情','text-button')}</div><div class="play-actions">${act('confirm','確認回覆','primary',state.selected?'':'disabled')}${act('menu','返回','secondary')}</div></section></main>`;
}

const responses = {
  "accept": {
    "title": "客軍入蜀",
    "body": "你率軍入蜀，劉璋設宴相迎，又送來軍糧。大軍隨後駐在葭萌，等待下一道命令。"
  },
  "delay": {
    "title": "使者再候",
    "body": "「我再等一次答覆，之後就回去覆命。」使者說完，退到門外。"
  },
  "delayEnd": {
    "title": "使者離去",
    "body": "你仍未答應。使者收起邀書，動身回益州。這次入蜀的機會，就此錯過。"
  },
  "assist": {
    "title": "準備北上",
    "body": "你命將士整備，打算按約協助對付張魯。龐統的取地建議，暫時擱下。"
  },
  "acquire": {
    "title": "留在益州",
    "body": "你暫不討張魯，開始結交當地人。軍中有人悄聲說：「此地，也可成為我們的基業。」"
  },
  "negotiate": {
    "title": "使者往返",
    "body": "「軍糧可以再議，但你們究竟要幫忙到何時？」劉璋的使者帶回這句話。"
  },
  "attack": {
    "title": "兵鋒轉南",
    "body": "你下令向南，攻打原本邀你來援的劉璋。取下益州，成為大軍的新目標。"
  },
  "limit": {
    "title": "留下援助",
    "body": "你回覆：「只協助應付北方，不奪城池。事情結束，就帶兵離開。」"
  },
  "withdraw": {
    "title": "撤回荊州",
    "body": "你命將士收拾行裝，準備撤回荊州。益州的基業留在身後，北方的威脅也仍在。"
  },
  "stop": {
    "title": "收兵議和",
    "body": "你放下酒杯，下令停止南攻，派人議和。對方是否肯相信你，還得看接下來怎麼做。"
  },
  "continue": {
    "title": "繼續進軍",
    "body": "你決定繼續攻取益州。將士領命出發，龐統的那句話卻仍留在席間。"
  }
};

function showPending() {
  if(!state.pending)return;
  const r=responses[state.pending==='delay'&&state.delay===1?'delayEnd':state.pending];
  if(!r){state.pending=null;save();return;}
  modal(r.title,`<p>${bi(r.body)}</p>`,act('advance',state.round===4||(state.pending==='delay'&&state.delay===1)?'查看結局':'繼續','primary'),false);
}

function confirm() {
  if(marching||state.screen!=='play'||state.pending||!scenario().options.some(o=>o.id===state.selected))return;
  state.pending=state.selected;save();showPending();
}
function advance() {
  if(marching||!state.pending)return;
  const id=state.pending, option=scenario().options.find(o=>o.id===id);
  state.history.push({round:state.round,id,title:option.title});
  state.pending=null;state.selected=null;
  if(id==='delay') {state.delay++;if(state.delay===2){state.ending='missed';state.screen='ending';}}
  else if(state.round===4){state.ending=id==='continue'?'conquest':'restraint';state.screen='ending';}
  else state.round++;
  close();save();render(true);
  if(id==='accept'||id==='attack') animateMarch(id);
}

// Movement is visual only: the new round is saved before animation starts.
// A refresh, skipped animation, or suspended browser cannot strand the game.
function animateMarch(kind) {
  const route=document.getElementById(kind==='accept'?'inbound-route':'southbound-route');
  const flag=document.getElementById('army-flag');
  if(!route||!flag)return;
  let frame=0,timer=0,done=false;
  const finish=()=>{
    if(done)return;
    done=true;cancelAnimationFrame(frame);clearTimeout(timer);
    document.removeEventListener('visibilitychange',onVisibility);
    marching=false;finishMarch=null;render(false);
    document.getElementById('announcement').textContent=kind==='accept'?'已抵達葭萌，可以下令。':'部隊已南下，可以繼續抉擇。';
  };
  const onVisibility=()=>{if(document.hidden)finish();};
  try {
    if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
    const length=route.getTotalLength();
    if(!Number.isFinite(length)||length<=0)return;
    const place=d=>{const pt=route.getPointAtLength(d);flag.setAttribute('transform',`translate(${pt.x+6},${pt.y-23})`);};
    marching=true;finishMarch=finish;
    app.querySelectorAll('button').forEach(b=>b.disabled=true);
    const skip=app.querySelector('[data-action="confirm"]');
    skip.disabled=false;skip.dataset.action='skip-march';skip.innerHTML=bi('略過行軍');
    app.querySelector('.hint').innerHTML=bi('部隊行軍中');
    const status=document.createElement('div');status.className='march-status';
    status.innerHTML=kind==='accept'?bi('公安 → 葭萌','Gong’an → Jiameng'):bi('葭萌 → 南下','Jiameng → South');
    app.querySelector('.map-wrap').appendChild(status);
    const trace=route.cloneNode(false);trace.removeAttribute('id');trace.setAttribute('class','march-trace');
    trace.style.strokeDasharray=String(length);trace.style.strokeDashoffset=String(length);
    route.parentNode.insertBefore(trace,route.nextSibling);
    place(0);
    const duration=kind==='accept'?3000:1600;
    const start=performance.now();
    const tick=now=>{
      if(done)return;
      try {
        const t=Math.min(1,Math.max(0,(now-start)/duration));
        const eased=t*t*(3-2*t);
        place(length*eased);trace.style.strokeDashoffset=String(length*(1-eased));
        if(t>=1)finish();else frame=requestAnimationFrame(tick);
      } catch(_){finish();}
    };
    document.addEventListener('visibilitychange',onVisibility);
    timer=setTimeout(finish,duration+900);
    frame=requestAnimationFrame(tick);
  } catch(_){finish();}
}

function ending() {
  const missed=state.ending==='missed',conquest=state.ending==='conquest',stopped=has('stop'),withdrawn=has('withdraw'),planned=has('acquire');
  const heading=missed?'未出兵':conquest?'偏向貪兵':stopped?'由貪轉向止兵':planned?'放下取地之念':'援助為主';
  const reason=missed?'你一直等待，沒有出兵。這次還無法判斷屬於哪一類兵。':conquest?'你選擇攻打劉璋，並繼續奪取益州。取地成為你的主要目的，因此偏向「貪兵」。':stopped?'你曾為了取地而進攻，後來決定停戰。先前偏向「貪」，最後選擇收手。':planned?'你曾想在益州立足，最後卻沒有轉兵奪地。你改變了方向，也限制了自己的野心。':'你選擇協助北方防務，沒有轉兵奪地。不過，要稱為「義兵」，還得看是否真的在救助受害的人。';
  const outcome=missed?'使者離去，你錯過了入蜀的機會。':conquest?'你決定繼續取地。史實中的劉備於214年取得益州，但勝利不等於理由正當。':stopped?'軍隊停止南攻，開始議和；已失去的信任，還需要修補。':withdrawn?'你下令撤回荊州，放棄在益州立足的機會。':'你留下協助北方防務，並答應事情結束就離開。';
  const q=conquest||stopped?'利人土地，欲人財貨，謂之貪。':missed||planned?'出兵雖勝，猶有後憂。':'誅暴救弱謂之義。';
  const source=missed||planned&&!conquest&&!stopped?'魏相勸止出兵；van Els，頁38–40':'《文子》；van Els，頁29';
  const plain=conquest||stopped?'為了搶別人的土地和財物而出兵，叫作「貪兵」。':missed||planned?'就算打贏，也可能留下麻煩。':'討伐暴虐的人，救助弱者，叫作「義兵」。';
  return `<main class="screen ending">${topbar('終 局')}<section class="ending-hero"><span class="ending-stamp">${bi('你這次的用兵判斷')}</span><h2>${bi(heading)}</h2><p class="ending-deck">${bi(reason)}</p></section><div class="end-content"><section class="end-section"><h3>${bi('這次的結果')}</h3><p>${bi(outcome)}</p></section><section class="end-section"><h3>${bi('回到閱讀')}</h3>${quote(q,source)}<p class="plain">${bi(plain)}</p>${!missed&&!conquest&&!stopped?`<p class="plain">${bi('受邀幫忙不是「應兵」；應兵指被攻打後，不得已反擊。')}</p>`:''}</section><div class="end-buttons">${act('replay','再做一次選擇','primary')}${act('journal','回看我的決定','secondary')}${act('home','返回封面','quiet')}</div></div></main>`;
}

function modal(title,body,footer='',dismissible=true) {
  if(!sheet.open)returnFocus=document.activeElement;
  sheetContent.innerHTML=`<div class="sheet-header"><h2 id="sheet-title">${bi(title)}</h2>${dismissible?`<button class="icon-button" data-action="close" aria-label="關閉 / Close">${closeIcon}</button>`:''}</div><div class="sheet-body">${body}</div>${footer?`<div class="sheet-footer">${footer}</div>`:''}`;
  sheet.dataset.locked=dismissible?'false':'true';
  if(!sheet.open)sheet.showModal();
  sheet.scrollTop=0;
}
function close(){if(sheet.open)sheet.close();if(returnFocus&&returnFocus.isConnected)returnFocus.focus({preventScroll:true});}
function background(){modal('一封來自益州的邀書',`<p>${bi('公元211年，劉璋擔心北方的曹操與張魯，邀劉備入蜀相助。','In 211 CE, Liu Zhang fears Cao Cao and Zhang Lu to the north, so he invites Liu Bei into Yi Province to help.')}</p><p>${bi('劉備身邊的龐統卻看中益州的土地與財富，勸他趁機立足。','Pang Tong sees Yi’s fertile land as a chance for Liu Bei to establish a base of his own.')}</p><p>${bi('如果你是劉備，會怎麼做？','If you were Liu Bei, what would you do?')}</p><small class="citation">${bi('故事取材史實，分支為遊戲設定。','Historical setting; alternative outcomes are fictional game branches.')}</small>`,act('close','明白了','primary'));}


function supplies(){
  state.asked=true;save();
  modal('使者答覆',`<p>${bi('「劉璋願提供軍糧，盼你協助對付張魯。詳細安排，入蜀後再談。」','“Liu Zhang will supply grain if you help against Zhang Lu. We can discuss the details once you enter Yi.”')}</p>`,act('close','回到抉擇','primary'));
  const b=app.querySelector('[data-action="supplies"]');if(b)b.innerHTML=bi('重看軍糧答覆');
}

function evidence(){
  const body=state.round===2?'劉璋希望你北上討魯。龐統卻看重益州富足，勸你留心這片土地。':state.round===3?'軍資不足，雙方互信也在減少。你的部隊仍在益州，下一道命令由你決定。':has('attack')?'龐統曾勸取益州，如今又提醒你：不能把攻打別人的國家當成樂事。':'劉璋曾說，抵抗敵人是為了安定百姓；他不願把百姓遷走來躲避敵軍。';
  modal('軍情',`<p>${bi(body)}</p>`,act('close','回到抉擇','primary'));
}

function sources(){modal('閱讀出處',`<p>${bi('本局的「義、應、貪」取自 van Els 討論的《文子》分類。','The terms righteous, responsive, and acquisitive warfare follow van Els’s discussion of the Wenzi.')}</p><p class="en">Paul van Els (2013). “Righteous, Furious, or Arrogant? On Classifications of Warfare in Early Chinese Texts.” In Peter A. Lorge (ed.), <em>Debating War in Chinese History</em>, pp. 13–40. Brill.</p>${cite('分類：頁29–31；出兵前檢查理由：頁37–40。')}`,act('close','返回','primary'));}
function journal(){modal('我的決定',`<ol class="journal">${state.history.map(h=>`<li><span class="journal-number">${nums[h.round]}</span><span>${bi(shortTitles[h.id])}</span></li>`).join('')}</ol>`,act('close','返回','primary'));}

function menu(){modal('抉擇手札',`<div class="menu-stack">${act('close','繼續本局','primary')}${act('background','故事背景','secondary')}${act('sources','閱讀出處','secondary')}${act('home','返回封面・保留進度','secondary')}${act('restart-confirm','重新開始','quiet')}</div>`);}
function render(scroll=false){app.innerHTML=state.screen==='play'?play():state.screen==='reading'?reading():state.screen==='ending'?ending():cover();if(scroll)window.scrollTo({top:0,behavior:'auto'});document.getElementById('announcement').textContent=state.screen==='play'?`第${nums[state.round]}回合，${scenario().title}`:state.screen==='ending'?'已到終局，請閱讀回饋':'';if(state.pending&&state.screen==='play')showPending();}
const actions={
  start:()=>{state={...fresh(),screen:'reading'};save();render(true);},
  resume:()=>{state.screen=state.ending?'ending':'play';save();render(true);},
  'read-next':()=>{if(state.readStep<2)state.readStep++;else state.screen='play';save();render(true);},
  'read-back':()=>{if(state.readStep>0)state.readStep--;else state.screen='cover';save();render(true);},
  confirm,advance,close,background,supplies,evidence,sources,menu,journal,
  'skip-march':()=>{if(finishMarch)finishMarch();},
  home:()=>{close();state.screen='cover';save();render(true);},
  replay:()=>{close();state={...fresh(),screen:'reading'};save();render(true);},
  'restart-confirm':()=>modal('重新開始本局？',`<p>${bi('目前的決策手札會清除，你將從開卷閱讀重新開始。','This clears your decisions and starts again at the reading.')}</p>`,act('replay','重新開始','primary')+act('close','保留本局','secondary')),
  'map-info':()=>modal('北方的壓力',`<p>${bi('張魯守漢中，曹操在更北、更東的地方。劉璋擔心北方局勢，於是向荊州的劉備求援。','Zhang Lu holds Hanzhong; Cao Cao lies farther north and east. Worried about them, Liu Zhang asks Liu Bei in Jing Province for help.')}</p><p>${bi('紅旗是你的位置，虛線是前進方向。','The red flag marks your army; the dashed line shows its route.')}</p><p class="map-names">曹操 Cao Cao · 張魯 Zhang Lu · 劉璋 Liu Zhang · 劉備 Liu Bei · 孫權 Sun Quan<br>成都 Chengdu · 公安 Gong’an · 葭萌 Jiameng<br>關中 Guanzhong · 長江 Yangtze River · 北 North</p>`,act('close','返回','primary')),
};
document.addEventListener('click',e=>{
  const choice=e.target.closest('[data-choice]');
  if(choice&&state.screen==='play'&&!state.pending&&!marching){
    const id=choice.dataset.choice;
    if(!scenario().options.some(o=>o.id===id))return;
    state.selected=id;save();
    app.querySelectorAll('[data-choice]').forEach(b=>{
      const selected=b.dataset.choice===id;
      b.classList.toggle('selected',selected);b.setAttribute('aria-pressed',String(selected));
      b.querySelector('.checkmark')?.remove();
      if(selected){const mark=document.createElement('span');mark.className='checkmark';mark.setAttribute('aria-hidden','true');mark.textContent='✓';b.appendChild(mark);}
    });
    app.querySelector('[data-action="confirm"]').disabled=false;
    app.querySelector('.hint').innerHTML=bi('已選擇，請確認回覆');
    return;
  }
  const b=e.target.closest('[data-action]');
  if(b&&!b.disabled&&actions[b.dataset.action]&&(!marching||b.dataset.action==='skip-march'))actions[b.dataset.action]();
});
sheet.addEventListener('cancel',e=>{if(sheet.dataset.locked==='true')e.preventDefault();});
window.YizhouGame=Object.freeze({getState:()=>JSON.parse(JSON.stringify(state)),getMissingTranslations:()=>[...missingEN],version:'1.3'});
render();
if (document.modelContext?.registerTool) {
  const lifecycle = new AbortController();
  try { Promise.resolve(document.modelContext.registerTool({
    name: "read_game_progress", description: "Read the current round and completed choices in the visible Yizhou game without changing play.",
    inputSchema: {type:"object",properties:{},additionalProperties:false},
    annotations: {readOnlyHint:true},
    execute(input) { if(!input || typeof input!=="object" || Array.isArray(input) || Object.keys(input).length) throw new Error("Expected an empty object"); return window.YizhouGame.getState(); }
  }, {signal:lifecycle.signal})).catch(()=>{}); } catch (_) {}
  window.addEventListener("pagehide",()=>lifecycle.abort(),{once:true});
}
})();
</script>
